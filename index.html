<!doctype html>
<html lang="en" data-accent="amber">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chronos — High-velocity time intelligence and project tracking platform. Built with React, Supabase, and Tailwind CSS." />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chronos-app-rosy.vercel.app/" />
    <meta property="og:title" content="Chronos - Time Intelligence &amp; Tracking" />
    <meta property="og:description" content="High-velocity time intelligence, project tracking, and analytics platform." />
    <meta property="og:image" content="https://raw.githubusercontent.com/NiL4gh/chronos-app/main/docs/chronos-preview.gif" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://chronos-app-rosy.vercel.app/" />
    <meta name="twitter:title" content="Chronos - Time Intelligence &amp; Tracking" />
    <meta name="twitter:description" content="High-velocity time intelligence, project tracking, and analytics platform." />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/NiL4gh/chronos-app/main/docs/chronos-preview.gif" />

    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'system';
          var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = t === 'dark' || (t === 'system' && sysDark);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.setAttribute('data-accent', localStorage.getItem('accent') || 'amber');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <title>Chronos &mdash; Time Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
