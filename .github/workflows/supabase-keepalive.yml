name: Supabase Keep-Alive

on:
  schedule:
    # Run every 3 days at 00:00 UTC to prevent 7-day Supabase auto-pause
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    steps:
      - name: Ping PostgREST Endpoint
        run: |
          SUPABASE_URL="${{ secrets.SUPABASE_URL || 'https://obmwiurcttgjchybvlpt.supabase.co' }}"
          ANON_KEY="${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ibXdpdXJjdHRnamNoeWJ2bHB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4NDI4ODksImV4cCI6MjA5ODQxODg4OX0.7QJWHj3ZEjgEN5ej9X2btem3ag-AYRBAzZE2v_xnmmQ' }}"
          
          echo "Pinging $SUPABASE_URL/rest/v1/organizations..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            "$SUPABASE_URL/rest/v1/organizations?select=id&limit=1")
          
          echo "Response HTTP status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "Supabase keep-alive ping successful. Activity timer reset."
            exit 0
          else
            echo "Unexpected HTTP status: $STATUS"
            exit 1
          fi
